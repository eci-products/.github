name: 功能需求
description: 提议新增功能或改进现有功能
title: "[需求] "
body:
  - type: markdown
    attributes:
      value: |
        请重点说明要解决的问题，而不只是描述希望采用的实现方式。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 当前遇到了什么问题？为什么需要这个功能？
      placeholder: 描述现状、问题及提出需求的原因。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 需求目标
      description: 这个需求希望达到什么结果？
      placeholder: 描述目标以及不在本次需求范围内的内容。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁会在什么情况下使用这个功能？
      placeholder: |
        作为……
        我希望……
        从而……
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些可验证的条件，才能认为需求已经完成？
      placeholder: |
        - [ ] 条件一
        - [ ] 条件二
        - [ ] 条件三
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可补充原型、截图、参考链接或其他说明。
