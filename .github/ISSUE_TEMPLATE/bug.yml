name: Bug 报告
description: 报告可以复现的异常或错误
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提交问题。请尽量提供完整信息，方便快速定位和处理。

  - type: textarea
    id: description
    attributes:
      label: 问题现象
      description: 请说明发生了什么问题。
      placeholder: 清楚、简洁地描述实际发生的情况。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出能够稳定复现问题的操作步骤。
      placeholder: |
        1. 进入……
        2. 点击……
        3. 输入……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下应该发生什么？
      placeholder: 描述你期望看到的结果。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写与问题有关的环境信息。
      placeholder: |
        - 系统及版本：
        - 浏览器或客户端版本：
        - 应用版本或提交号：
        - 其他相关配置：
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可直接拖入截图或粘贴日志。请先删除密码、Token 等敏感信息。

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有哪些信息可能有助于定位问题？
